name: AAC Forge 1.20.1 verification

on:
  push:
    branches:
      - mc/1.20.1
  pull_request:
    branches:
      - mc/1.20.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-boundary:
    name: Verify Forge 1.20.1 source boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify platform metadata and naming
        run: |
          chmod +x gradlew
          ./gradlew verifyAacPlatformConfiguration --no-daemon -PaacMetadataOnly=true
